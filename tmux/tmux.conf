# ~/.config/tmux/tmux.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
# Set prefix to Ctrl-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix
#
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Enable mouse support
set -g mouse on

# Start window numbering at 1
set -g base-index 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'omerxx/tmux-sessionx'

# set -g @sessionx-bind 'o'
# set -g @sessionx-fzf-builtin-tmux 'on'
# set -g @sessionx-zoxide-mode 'false'
# set -g @sessionx-window-mode 'false'
# set -g @sessionx-tree-mode 'on'
# set -g @sessionx-custom-paths-subdirectories 'false'
bind-key "o" run-shell "sesh connect \"$(
  sesh list -H --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""


set-option -g status-position bottom 
set -g status-right "%H:%M"


set -g status-left "#[fg=#DFDDC8,bg=#4B565C] #S #[bg=#2d353b,fg=#4B565C]"
# Using solid blocks

set-option -g status-style bg=#2d353b,fg=white
set-window-option -g window-status-format '#[bg=#2d353b,fg=#35a77C,bold] #I #W '
# set-window-option -g window-status-format '#[bg=#4d353b,fg=#35a77C,bold]#I #W'
set-window-option -g window-status-current-format '#[fg=#2d353b,bg=#35a77C,bold] #I #W '
# Using powerline-style separators
# set-window-option -g window-status-format '#[fg=colour244,bg=colour234]#[fg=colour240] #I #[fg=colour244]❯#[fg=colour240] #W #[fg=colour234,bg=colour234]'
# set-window-option -g window-status-current-format '#[fg=colour234,bg=colour31]#[fg=colour117,bg=colour31] #I #[fg=colour231]❯ #W #[fg=colour31,bg=colour234]'



run '~/.config/tmux/plugins/tpm/tpm'

