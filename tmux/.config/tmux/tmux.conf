# ~/.config/tmux/tmux.conf
set -g default-terminal "xterm-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",xterm-256color:usstyle"
# Set prefix to Ctrl-b
# set -g prefix M-b
set -g prefix M-b
# unbind C-b
# bind M-a send-prefix
bind a send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Enable mouse support
set -g mouse on

# Start window numbering at 1
set -g base-index 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰂀'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_status_charged '󰚥'
set -g @batt_icon_status_charged '󰚥'
set -g @batt_icon_status_charging '󰚥'
set -g @batt_icon_status_discharging '󰢝'
set -g @batt_icon_status_unknown '󰢝'
set -g @rose_pine_date_time "%a %d/%m %H:%M"
set -g @rose_pine_default_window_behavior off
set -g @rose_pine_disable_active_window_menu on
set -g @rose_pine_field_separator "  "
set -g @rose_pine_host on
set -g @rose_pine_hostname_short off
set -g @rose_pine_left_separator " > "
set -g @rose_pine_status_left_append_section "  "
set -g @rose_pine_status_left_prepend_section " "
# set -g @rose_pine_status_right_append_section "#(~/.config/tmux/tailscale-status.sh)#(~/.config/tmux/twingate-status.sh)"
set -g @rose_pine_variant main
set -g @rose_pine_window_separator :
set -g @rose_pine_window_status_separator " -> "
set -g @rose_pine_status_right_prepend_section ''
set -g @rose_pine_status_right_append_section '#{battery_icon}  '


bind-key "o" run-shell "sesh connect \"$(
  sesh list -H --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""


